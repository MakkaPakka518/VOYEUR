<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13243a">
  <script>try{const t=localStorage.getItem('ig-luv-theme')||'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;if(t==='dark')document.querySelector('meta[name="theme-color"]').content='#0b1522'}catch{document.documentElement.dataset.theme='light'}</script>
  <title data-i18n="login.title">回到观察室 | VOYEUR</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <a class="wordmark" href="/login"><span class="wordmark-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.6-9.3-9C1.2 8.8 3.1 5 6.7 5c2 0 3.4 1.1 5.3 3.2C13.9 6.1 15.3 5 17.3 5c3.6 0 5.5 3.8 4 7C19.2 16.4 12 21 12 21Z"/></svg></span><span>VOYEUR</span></a>
      <div>
        <h1><span data-i18n="login.heroLine1">Ta 的痕迹，</span><br><span data-i18n="login.heroLine2">一条别丢。</span></h1>
        <p data-i18n="login.tagline">出现过，就别想消失。</p>
      </div>
      <div class="frame-stack" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
    <section class="login-form-wrap">
      <label class="locale-control login-locale"><span data-i18n="language.label">语言</span><select class="locale-select"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
      <form action="/login" method="post" class="login-form">
        <h2 data-i18n="login.heading">回到观察室</h2>
        <p id="login-error" class="form-error" data-i18n="login.error" hidden>密码不正确，请重试。</p>
        <label>
          <span data-i18n="login.password">观察室密码</span>
          <input name="password" type="password" required autofocus autocomplete="current-password">
        </label>
        <button class="primary-button" type="submit" data-i18n="login.submit">继续看着 Ta</button>
      </form>
    </section>
  </main>
  <script>document.getElementById('login-error').hidden = !new URLSearchParams(location.search).has('error')</script>
  <script type="module">import { initI18n } from '/static/i18n.js'; initI18n();</script>
</body>
</html>
