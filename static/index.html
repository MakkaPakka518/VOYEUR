<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13243a">
  <script>try{const t=localStorage.getItem('ig-luv-theme')||'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;if(t==='dark')document.querySelector('meta[name="theme-color"]').content='#0b1522'}catch{document.documentElement.dataset.theme='light'}</script>
  <title>IG Luv</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="wordmark" href="/" data-route aria-label="IG Luv 首页"><span class="wordmark-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.6-9.3-9C1.2 8.8 3.1 5 6.7 5c2 0 3.4 1.1 5.3 3.2C13.9 6.1 15.3 5 17.3 5c3.6 0 5.5 3.8 4 7C19.2 16.4 12 21 12 21Z"/></svg></span><span>IG Luv</span></a>
      <nav class="side-nav" aria-label="主导航">
        <a class="nav-link active" href="/" data-route aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 5.5V3m8 2.5V3M4 9h16"/></svg>全部</a>
        <a class="nav-link" href="/instagram" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#instagram"/></svg>Instagram</a>
        <a class="nav-link" href="/tiktok" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#tiktok"/></svg>TikTok</a>
        <a class="nav-link" href="/douyin" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#douyin"/></svg>抖音</a>
        <a class="nav-link" href="/threads" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#threads"/></svg>Threads</a>
        <a class="nav-link" href="/x" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#x"/></svg>X</a>
        <a class="nav-link" href="/moments" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#wechat"/></svg>微信</a>
        <a class="nav-link" href="/settings" data-route><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 13.3l1.4 1.1-2 3.5-1.8-.7a7.8 7.8 0 0 1-2.3 1.3L14 20.5h-4l-.3-2a7.8 7.8 0 0 1-2.3-1.3l-1.8.7-2-3.5L5 13.3a7.7 7.7 0 0 1 0-2.6L3.6 9.6l2-3.5 1.8.7a7.8 7.8 0 0 1 2.3-1.3l.3-2h4l.3 2a7.8 7.8 0 0 1 2.3 1.3l1.8-.7 2 3.5-1.4 1.1a7.7 7.7 0 0 1 0 2.6z"/></svg>设置</a>
      </nav>
      <div class="sidebar-foot"><span id="rail-state" class="rail-state">等待配置</span><form action="/logout" method="post"><button class="text-button" type="submit">退出面板</button></form></div>
    </aside>
    <main class="workspace">
      <header class="mobile-header">
        <a class="wordmark" href="/" data-route><span class="wordmark-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.6-9.3-9C1.2 8.8 3.1 5 6.7 5c2 0 3.4 1.1 5.3 3.2C13.9 6.1 15.3 5 17.3 5c3.6 0 5.5 3.8 4 7C19.2 16.4 12 21 12 21Z"/></svg></span><span>IG Luv</span></a>
        <div class="mobile-header-actions"><button class="icon-button top-refresh-button" id="mobile-run" type="button" aria-label="立即检查"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button><div class="theme-toggle" aria-label="主题切换"></div></div>
      </header>
      <div class="workspace-inner">
        <header class="page-header">
          <div><div class="page-title-row"><svg id="page-brand" class="platform-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><use/></svg><h1 id="page-title" tabindex="-1">全部媒体</h1></div><p id="page-description">关注的动态、截图和原始媒体。</p></div>
          <div class="page-header-actions"><button class="primary-button top-refresh-button" id="run-now" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>立即检查</button><div class="theme-toggle" aria-label="主题切换"></div></div>
        </header>
        <section class="status-band" id="status-band" aria-live="polite">
          <div class="status-copy"><span class="status-dot"></span><strong id="status-title">正在读取状态</strong><span id="status-detail">请稍候</span><a id="status-action" href="#" data-preview="image" hidden>查看登录页面</a></div>
          <time id="status-time"></time><div class="capture-track" aria-hidden="true"><span></span></div>
        </section>
        <section id="library" class="library-section" aria-labelledby="library-title">
          <div class="section-heading"><h2 id="library-title">媒体</h2><div class="filter-group" role="group" aria-label="媒体筛选">
            <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-filter="image" aria-pressed="false">图片</button>
            <button class="filter" type="button" data-filter="video" aria-pressed="false">视频</button>
            <button class="filter" type="button" data-filter="screenshot" aria-pressed="false">截图</button>
            <button class="filter" type="button" data-filter="text" aria-pressed="false">文字</button>
          </div></div>
          <div id="library-content" class="library-content"><div class="loading-grid" aria-label="加载媒体"><span></span><span></span><span></span></div></div>
        </section>
        <section id="settings" class="settings-section" aria-labelledby="page-title" hidden>
          <form id="settings-form" class="settings-form">
            <details id="platform-settings" class="settings-group">
              <summary><span>平台与登录</span><span id="platform-summary" class="summary-value">Instagram</span></summary>
              <div class="settings-fields">
                <label class="wide-field"><span>配置平台</span><select id="settings-platform"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="douyin">抖音</option><option value="threads">Threads</option><option value="x">X</option><option value="wechat">微信朋友圈</option></select></label>
                <label class="platform-enabled-field wide-field"><span><strong>启用此平台</strong><small>关闭后停止采集，并从手机底栏隐藏</small></span><input id="platform-enabled" type="checkbox" role="switch" checked></label>
                <label id="login-method-field" class="wide-field" hidden><span id="login-method-label">TikTok 登录方式</span><select id="login-method"><option value="password">账号密码</option><option value="cookie">导入 Cookie</option><option value="qrcode" hidden disabled>二维码登录</option><option value="phone" hidden disabled>手机号登录</option></select></label>
                <div id="verification-panel" class="verification-panel wide-field" hidden>
                  <div><strong id="verification-title">输入 Instagram 验证码</strong><p>填写短信、邮箱或验证器收到的代码，采集器会继续当前登录。</p></div>
                  <label><span>验证码</span><input id="verification-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" placeholder="输入验证码"></label>
                  <button class="primary-button" id="submit-verification" type="button">提交验证码</button>
                </div>
                <label><span id="account-label">Instagram 账号</span><input id="ig-username" name="username" required autocomplete="username" placeholder="手机号、邮箱或用户名"></label>
                <label><span id="password-label">Instagram 密码</span><input id="ig-password" name="password" type="password" autocomplete="current-password" placeholder="输入登录密码"><small id="password-note">留空则保留已保存的密码</small></label>
                <label id="cookie-field" class="wide-field" hidden><span id="cookie-label">TikTok Cookie</span><input id="tiktok-cookie" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="sessionid=...; sessionid_ss=..."><small id="cookie-note">从已登录 TikTok 的浏览器网络请求中复制 Cookie 请求头的值。</small></label>
                <p id="public-note" class="wide-field settings-note" hidden>采集公开账号时，账号和密码可以都留空。</p>
              </div>
            </details>
            <details id="targets-settings" class="settings-group">
              <summary><span>关注用户</span><span id="targets-summary" class="summary-value">未设置</span></summary>
              <div class="settings-fields"><label class="wide-field"><span>关注用户</span><input id="ig-targets" name="targets" required placeholder="例如 instagram, natgeo" autocapitalize="none" spellcheck="false"><datalist id="wechat-authors"></datalist><small id="targets-note">多个用户名用逗号分隔，不需要输入 @</small></label></div>
            </details>
            <details id="schedule-settings" class="settings-group">
              <summary><span>采集频率</span><span id="schedule-summary" class="summary-value">5 分钟</span></summary>
              <div class="settings-fields">
                <label><span>检查间隔</span><select id="interval" name="interval"><option value="60">1 分钟</option><option value="300">5 分钟</option><option value="900">15 分钟</option><option value="3600">1 小时</option></select></label>
                <label><span>每人检查</span><select id="post-limit" name="post_limit"><option value="6">最近 6 条</option><option value="12">最近 12 条</option><option value="24">最近 24 条</option></select></label>
                <label class="wide-field"><span>自动清理天数</span><input id="cleanup-days" type="number" inputmode="numeric" min="0" max="3650" step="1" value="0"><small>0 表示关闭；到期后删除此平台的主页截图、帖子截图和视频，保留原图与文字</small></label>
              </div>
            </details>
            <div class="form-actions"><button class="primary-button" type="submit">保存并连接</button><button class="secondary-button" id="reset-session" type="button">重置 Instagram 会话</button><button class="secondary-button" id="cleanup-platform" type="button">清理此平台截图和视频</button></div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="手机导航">
    <a href="/instagram" data-route aria-label="Instagram"><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#instagram"/></svg><span>IG</span></a>
    <a href="/tiktok" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#tiktok"/></svg><span>TikTok</span></a>
    <a href="/douyin" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#douyin"/></svg><span>抖音</span></a>
    <a href="/threads" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#threads"/></svg><span>Threads</span></a>
    <a href="/x" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#x"/></svg><span>X</span></a>
    <a href="/moments" data-route><svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons/platforms.svg#wechat"/></svg><span>微信</span></a>
    <a href="/settings" data-route><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 13.3l1.4 1.1-2 3.5-1.8-.7a7.8 7.8 0 0 1-2.3 1.3L14 20.5h-4l-.3-2a7.8 7.8 0 0 1-2.3-1.3l-1.8.7-2-3.5L5 13.3a7.7 7.7 0 0 1 0-2.6L3.6 9.6l2-3.5 1.8.7a7.8 7.8 0 0 1 2.3-1.3l.3-2h4l.3 2a7.8 7.8 0 0 1 2.3 1.3l1.8-.7 2 3.5-1.4 1.1a7.7 7.7 0 0 1 0 2.6z"/></svg><span>设置</span></a>
  </nav>
  <dialog id="media-preview" class="media-preview" aria-labelledby="preview-title">
    <header class="preview-header"><h2 id="preview-title">媒体预览</h2><div class="preview-actions"><a id="preview-download" class="preview-download" href="#">下载</a><button id="preview-close" class="preview-close" type="button" aria-label="关闭预览" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header>
    <div class="preview-body"><p id="preview-message" role="status" aria-live="polite"></p><div id="preview-content"></div></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
