<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13243a">
  <title>ig luv</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="wordmark" href="#library" aria-label="ig luv 首页">
        <span class="wordmark-mark">ig</span>
        <span>luv</span>
      </a>
      <nav class="side-nav" aria-label="主导航">
        <a class="nav-link active" href="#library" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 5.5V3m8 2.5V3M4 9h16"/></svg>
          收藏库
        </a>
        <a class="nav-link" href="#settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 13.3l1.4 1.1-2 3.5-1.8-.7a7.8 7.8 0 0 1-2.3 1.3L14 20.5h-4l-.3-2a7.8 7.8 0 0 1-2.3-1.3l-1.8.7-2-3.5L5 13.3a7.7 7.7 0 0 1 0-2.6L3.6 9.6l2-3.5 1.8.7a7.8 7.8 0 0 1 2.3-1.3l.3-2h4l.3 2a7.8 7.8 0 0 1 2.3 1.3l1.8-.7 2 3.5-1.4 1.1a7.7 7.7 0 0 1 0 2.6z"/></svg>
          设置
        </a>
      </nav>
      <div class="sidebar-foot">
        <span id="rail-state" class="rail-state">等待配置</span>
        <form action="/logout" method="post"><button class="text-button" type="submit">退出面板</button></form>
      </div>
    </aside>

    <main class="workspace">
      <header class="mobile-header">
        <a class="wordmark" href="#library"><span class="wordmark-mark">ig</span><span>luv</span></a>
        <button class="icon-button" id="mobile-run" type="button" aria-label="立即检查">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        </button>
      </header>

      <div class="workspace-inner">
        <header class="page-header">
          <div>
            <h1>收藏库</h1>
            <p>关注的动态、截图和原始媒体。</p>
          </div>
          <button class="primary-button" id="run-now" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
            立即检查
          </button>
        </header>

        <section class="status-band" id="status-band" aria-live="polite">
          <div class="status-copy">
            <span class="status-dot"></span>
            <strong id="status-title">正在读取状态</strong>
            <span id="status-detail">请稍候</span>
            <a id="status-action" href="#" target="_blank" hidden>查看登录页面</a>
          </div>
          <time id="status-time"></time>
          <div class="capture-track" aria-hidden="true"><span></span></div>
        </section>

        <section id="library" class="library-section" aria-labelledby="library-title">
          <div class="section-heading">
            <h2 id="library-title">媒体</h2>
            <div class="filter-group" role="group" aria-label="媒体筛选">
              <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
              <button class="filter" type="button" data-filter="image" aria-pressed="false">图片</button>
              <button class="filter" type="button" data-filter="video" aria-pressed="false">视频</button>
              <button class="filter" type="button" data-filter="screenshot" aria-pressed="false">截图</button>
            </div>
          </div>
          <div id="library-content" class="library-content">
            <div class="loading-grid" aria-label="加载媒体">
              <span></span><span></span><span></span>
            </div>
          </div>
        </section>

        <section id="settings" class="settings-section" aria-labelledby="settings-title">
          <div class="settings-intro">
            <h2 id="settings-title">采集设置</h2>
            <p>凭据只保存在这台 VPS。成功登录后会复用浏览器会话。</p>
          </div>
          <form id="settings-form" class="settings-form">
            <div id="verification-panel" class="verification-panel wide-field" hidden>
              <div>
                <strong>输入 Instagram 验证码</strong>
                <p>填写短信、邮箱或验证器收到的代码，采集器会继续当前登录。</p>
              </div>
              <label>
                <span>验证码</span>
                <input id="verification-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" placeholder="输入验证码">
              </label>
              <button class="primary-button" id="submit-verification" type="button">提交验证码</button>
            </div>
            <label>
              <span>Instagram 账号</span>
              <input id="ig-username" name="username" required autocomplete="username" placeholder="手机号、邮箱或用户名">
            </label>
            <label>
              <span>Instagram 密码</span>
              <input id="ig-password" name="password" type="password" autocomplete="current-password" placeholder="输入登录密码">
              <small id="password-note">留空则保留已保存的密码</small>
            </label>
            <label class="wide-field">
              <span>关注用户</span>
              <input id="ig-targets" name="targets" required placeholder="例如 instagram, natgeo" autocapitalize="none" spellcheck="false">
              <small>多个用户名用逗号分隔，不需要输入 @</small>
            </label>
            <label>
              <span>检查间隔</span>
              <select id="interval" name="interval">
                <option value="60">1 分钟</option>
                <option value="300">5 分钟</option>
                <option value="900">15 分钟</option>
                <option value="3600">1 小时</option>
              </select>
            </label>
            <label>
              <span>每人检查</span>
              <select id="post-limit" name="post_limit">
                <option value="6">最近 6 条</option>
                <option value="12">最近 12 条</option>
                <option value="24">最近 24 条</option>
              </select>
            </label>
            <div class="form-actions wide-field">
              <button class="primary-button" type="submit">保存并连接</button>
              <button class="secondary-button" id="reset-session" type="button">重置 IG 会话</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="手机导航">
    <a href="#library" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 5.5V3m8 2.5V3M4 9h16"/></svg><span>收藏库</span></a>
    <a href="#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 13.3l1.4 1.1-2 3.5-1.8-.7a7.8 7.8 0 0 1-2.3 1.3L14 20.5h-4l-.3-2a7.8 7.8 0 0 1-2.3-1.3l-1.8.7-2-3.5L5 13.3a7.7 7.7 0 0 1 0-2.6L3.6 9.6l2-3.5 1.8.7a7.8 7.8 0 0 1 2.3-1.3l.3-2h4l.3 2a7.8 7.8 0 0 1 2.3 1.3l1.8-.7 2 3.5-1.4 1.1a7.7 7.7 0 0 1 0 2.6z"/></svg><span>设置</span></a>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
